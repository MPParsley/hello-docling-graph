name: Build & deploy docling-graph demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Install docling-graph (CPU-only torch)
        run: |
          uv venv .venv
          uv pip install --torch-backend cpu -r requirements.txt

      - name: Run demo (document -> knowledge graph)
        env:
          # Optional: add this repository secret to use a real LLM instead of the offline mock.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: .venv/bin/python demo.py

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
